<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Database Arxitekturasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1626;
  --bg-grid:#16243c;
  --panel:#101f36;
  --panel-2:#0e1b30;
  --line:#24405f;
  --line-soft:#1a3050;
  --ink:#d9e6f5;
  --muted:#7c96b6;
  --faint:#54708f;
  --pk:#ffc861;
  --fk:#6fe0c0;
  --uk:#d9a0f0;
  --typ:#7fb0e8;
  --ext:#f08c7a;
  --accent:#4fa3f7;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  overflow:hidden;
  font-size:14px;
}
/* ===== Layout ===== */
#app{display:flex;height:100vh}
/* ===== Sidebar ===== */
#sidebar{
  width:248px;min-width:248px;
  background:var(--panel-2);
  border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;
  z-index:30;
}
#brand{
  padding:18px 18px 14px;
  border-bottom:1px solid var(--line-soft);
}
#brand h1{
  font-family:var(--mono);
  font-size:15px;font-weight:700;letter-spacing:.04em;
  color:var(--ink);
}
#brand h1 span{color:var(--accent)}
#brand p{font-size:11px;color:var(--faint);margin-top:3px;letter-spacing:.02em}
#menu{flex:1;overflow-y:auto;padding:10px 8px}
.menu-group{
  font-size:10px;text-transform:uppercase;letter-spacing:.14em;
  color:var(--faint);padding:12px 10px 6px;
}
.menu-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:6px;cursor:pointer;
  color:var(--muted);font-family:var(--mono);font-size:12.5px;
  border:1px solid transparent;
  transition:background .15s,color .15s;
  user-select:none;
}
.menu-item:hover{background:var(--bg-grid);color:var(--ink)}
.menu-item.active{
  background:var(--bg-grid);color:var(--ink);
  border-color:var(--line);
}
.menu-item .dot{
  width:7px;height:7px;border-radius:2px;background:var(--faint);flex:none;
}
.menu-item.active .dot{background:var(--accent)}
.menu-item .cnt{
  margin-left:auto;font-size:10px;color:var(--faint);
  background:var(--panel);padding:1px 6px;border-radius:8px;
}
/* Yakunlangan servis — jadvallar soni yashil */
.menu-item.done .cnt{
  color:#5bd49a;background:rgba(91,212,154,.13);
  border:1px solid rgba(91,212,154,.30);font-weight:600;
}
.menu-item.done .dot{background:#5bd49a;box-shadow:0 0 6px rgba(91,212,154,.55)}
.menu-item.done.active .dot{background:#5bd49a}
#svc-title .done-badge{
  display:inline-flex;align-items:center;gap:5px;margin-left:10px;
  font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.04em;
  color:#5bd49a;background:rgba(91,212,154,.12);
  border:1px solid rgba(91,212,154,.30);border-radius:7px;padding:2px 9px;
}
.menu-item.doc{font-style:normal}
.menu-item.doc .dot{
  background:transparent;border:1.2px dashed var(--faint);
  width:9px;height:9px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:7px;color:var(--pk);line-height:1;
}
.menu-item.doc.active .dot{border-color:var(--pk);color:var(--pk)}
.menu-item.doc .cnt{color:var(--pk);background:rgba(255,200,97,.08)}
.doc-badge{
  font-size:9px;font-weight:600;letter-spacing:.08em;
  color:var(--pk);background:rgba(255,200,97,.12);
  border:1px dashed rgba(255,200,97,.4);
  padding:2px 7px;border-radius:4px;vertical-align:2px;margin-left:8px;
}
.doc-mode .tbl{border-style:dashed}
.doc-mode .tbl:hover{border-style:solid}
#sidebar-foot{
  padding:10px 14px;border-top:1px solid var(--line-soft);
  font-size:10px;color:var(--faint);line-height:1.6;font-family:var(--mono);
}
/* ===== Main ===== */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{
  height:56px;flex:none;
  display:flex;align-items:center;gap:14px;
  padding:0 22px;
  border-bottom:1px solid var(--line-soft);
  background:var(--panel-2);
}
#svc-title{font-family:var(--mono);font-size:15px;font-weight:600}
#svc-desc{font-size:12px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#legend{display:flex;gap:12px;flex:none}
.xlink{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;flex:none;
  border:1px solid var(--line);border-radius:9px;background:var(--panel);
  font-family:var(--sans);font-size:12px;font-weight:600;color:var(--fg);
  text-decoration:none;cursor:pointer;white-space:nowrap;transition:all .15s}
.xlink:hover{border-color:var(--accent);color:var(--accent);background:rgba(90,150,220,.08)}
.xlink .ar{font-size:13px;opacity:.7}
#ui-link{margin-left:8px}
#ui-link.on{border-color:var(--accent);color:var(--accent)}
.lg{display:flex;align-items:center;gap:5px;font-size:10px;font-family:var(--mono);color:var(--muted)}
.lg i{width:8px;height:8px;border-radius:2px;display:inline-block}
/* ===== Canvas ===== */
#canvas-wrap{flex:1;overflow:auto;position:relative;
  background-image:radial-gradient(circle,var(--bg-grid) 1px,transparent 1px);
  background-size:26px 26px;
}
#canvas{position:relative;min-width:100%;min-height:100%}
#wires{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.wireg{pointer-events:visibleStroke;cursor:pointer}
.wire-hit{fill:none;stroke:transparent;stroke-width:14}
.wire{fill:none;stroke:var(--line);stroke-width:1.5;transition:stroke .15s,opacity .15s,stroke-width .15s}
.wire.w11{stroke:#a97fd4}
.wire.wident{stroke:#c9a35a;stroke-dasharray:2 4}
.wire.wself{stroke:#5f87b8;stroke-dasharray:6 4}
.wireg:hover .wire{stroke:var(--fk);stroke-width:2.5;opacity:1}
.wire.hot{stroke:var(--fk);stroke-width:2.5}
.has-focus .wire{opacity:.1}
.has-focus .wire.hot{opacity:1}
.has-focus .wireg:hover .wire{opacity:1}
.has-focus .tbl.wired{opacity:1;border-color:var(--fk);
  box-shadow:0 0 0 2px rgba(111,224,192,.25),0 10px 32px rgba(0,0,0,.5)}
/* ===== Table card ===== */
.tbl{
  position:absolute;width:252px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  font-family:var(--mono);
  cursor:pointer;
  transition:opacity .25s,border-color .2s,box-shadow .2s;
  box-shadow:0 4px 18px rgba(0,0,0,.35);
}
.tbl:hover{border-color:var(--accent)}
.has-focus .tbl{opacity:.18}
.has-focus .tbl.related{opacity:.55}
.has-focus .tbl.focused{
  opacity:1;border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(79,163,247,.35),0 10px 32px rgba(0,0,0,.5);
}
.tbl-h{
  padding:8px 12px;
  border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,rgba(79,163,247,.10),transparent);
  border-radius:8px 8px 0 0;
}
.tbl-h b{font-size:12.5px;font-weight:600;letter-spacing:.02em}
.tbl-h .n{margin-left:auto;font-size:9.5px;color:var(--faint)}
.tbl-h .lnk{
  width:24px;height:24px;flex:none;margin-left:2px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--line);border-radius:7px;
  color:var(--fk);cursor:pointer;padding:0;
  transition:background .15s,border-color .15s,transform .12s;
}
.tbl-h .lnk svg{width:14px;height:14px;display:block}
.tbl-h .lnk:hover{background:rgba(90,150,220,.16);border-color:var(--fk);transform:scale(1.08)}
.tbl-h .lnk:active{transform:scale(.94)}
.tbl-h .lnk.on{background:var(--fk);border-color:var(--fk);color:#0d1520}
.row{
  display:flex;align-items:center;gap:6px;
  padding:3.5px 12px;font-size:11px;line-height:1.35;
  border-bottom:1px solid rgba(26,48,80,.4);
}
.row:last-child{border-bottom:none;border-radius:0 0 8px 8px}
.row.aud{color:var(--faint);font-size:10px;justify-content:center;background:rgba(26,48,80,.25)}
.d-col.aud-col{opacity:.75;border-style:dashed}
.row .cn{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ct{color:var(--typ);margin-left:auto;font-size:10px;flex:none}
.k{font-size:8.5px;font-weight:700;padding:1px 4px;border-radius:3px;flex:none;letter-spacing:.04em}
.k.pk{background:rgba(255,200,97,.16);color:var(--pk)}
.k.fk{background:rgba(111,224,192,.14);color:var(--fk)}
.k.uk{background:rgba(217,160,240,.14);color:var(--uk)}
.k.ext{background:rgba(240,140,122,.14);color:var(--ext)}
/* ===== Drawer ===== */
#drawer{
  position:fixed;top:0;right:0;height:100vh;width:50vw;min-width:460px;max-width:92vw;
  background:var(--panel-2);
  border-left:1px solid var(--line);
  transform:translateX(105%);
  transition:transform .28s cubic-bezier(.22,.8,.3,1);
  z-index:50;display:flex;flex-direction:column;
  box-shadow:-18px 0 50px rgba(0,0,0,.5);
}
#drawer.open{transform:translateX(0)}
#drawer-h{
  padding:18px 20px 14px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:flex-start;gap:12px;
}
#drawer-h .t{font-family:var(--mono);font-size:16px;font-weight:700}
#drawer-h .s{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:2px}
#drawer-close{
  margin-left:auto;background:none;border:1px solid var(--line);
  color:var(--muted);width:28px;height:28px;border-radius:6px;cursor:pointer;
  font-size:14px;line-height:1;flex:none;
}
#drawer-close:hover{color:var(--ink);border-color:var(--accent)}
#drawer-sql{
  margin-left:auto;background:none;border:1px solid var(--line);
  color:var(--typ);height:28px;padding:0 10px;border-radius:6px;cursor:pointer;
  font-size:11px;font-family:var(--mono);font-weight:600;flex:none;
  transition:color .15s,border-color .15s;
}
#drawer-sql:hover{color:var(--ink);border-color:var(--accent)}
#drawer-sql.copied{color:var(--fk);border-color:var(--fk)}
#drawer-h #drawer-close{margin-left:8px}
#drawer-body{flex:1;overflow-y:auto;padding:16px 20px 40px}
.d-desc{
  font-size:12.5px;color:var(--muted);line-height:1.6;
  padding:10px 12px;background:var(--panel);border:1px solid var(--line-soft);
  border-radius:6px;margin-bottom:18px;
}
.d-sec{
  font-size:10px;text-transform:uppercase;letter-spacing:.14em;
  color:var(--faint);margin:18px 0 8px;
}
.d-col{
  display:grid;grid-template-columns:minmax(150px,200px) minmax(95px,130px) 86px minmax(0,1fr);
  gap:2px 12px;align-items:baseline;
  border:1px solid var(--line-soft);border-radius:6px;
  padding:8px 12px;margin-bottom:6px;background:var(--panel);
}
.d-col .nm{font-family:var(--mono);font-size:12.5px;font-weight:600;word-break:break-word}
.d-col .tp{font-family:var(--mono);font-size:11px;color:var(--typ)}
.d-col .kk{display:flex;gap:4px;flex-wrap:wrap}
.d-col .dsc{font-size:11.5px;color:var(--muted);line-height:1.55;word-break:break-word;min-width:0}
.d-col .ref{
  font-family:var(--mono);font-size:10.5px;color:var(--fk);
  display:block;margin-top:2px;word-break:break-all;
}
.d-col .ref.ext{color:var(--ext)}
.d-col .ref.use{color:#c9a227;font-weight:500}
.d-rel{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  padding:6px 10px;border:1px dashed var(--line);border-radius:6px;margin-bottom:6px;
}
.d-rel b{color:var(--fk);font-weight:600}
#overlay{
  position:fixed;inset:0;background:rgba(5,10,20,.35);
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;
}
#overlay.show{opacity:1;pointer-events:auto}
/* drawer torayganda tavsif alohida to'liq qatorga o'tadi */
@media(max-width:1500px){
  #drawer .d-col{grid-template-columns:minmax(140px,auto) minmax(90px,auto) 1fr}
  #drawer .d-col .kk{justify-self:end}
  #drawer .d-col .dsc{grid-column:1/-1;padding-top:2px;border-top:1px dashed rgba(36,64,95,.5);margin-top:4px}
}
/* Hujjat/standart sahifalari — servicelardan vizual farq */
.menu-item.doc{font-style:italic;border-left:2px dashed var(--pk);border-radius:0 6px 6px 0;margin-left:2px}
.menu-item.doc .dot{background:none;color:var(--pk);width:auto;height:auto;font-size:11px;font-style:normal}
.menu-item.doc.active .dot{color:var(--pk)}
.menu-item.doc .cnt{color:var(--pk);background:rgba(255,200,97,.1)}
.doc-badge{
  font-size:9.5px;font-weight:700;letter-spacing:.08em;vertical-align:middle;
  color:var(--pk);background:rgba(255,200,97,.12);border:1px dashed rgba(255,200,97,.45);
  padding:2px 8px;border-radius:10px;margin-left:8px;
}
.docmode .tbl{border-style:dashed;border-color:rgba(255,200,97,.35)}
.docmode .tbl-h{background:linear-gradient(180deg,rgba(255,200,97,.09),transparent)}
.docmode .tbl:hover{border-color:var(--pk)}
.has-focus.docmode .tbl.focused{border-color:var(--pk);box-shadow:0 0 0 2px rgba(255,200,97,.3),0 10px 32px rgba(0,0,0,.5)}
/* mobile */
#burger{display:none}
@media(max-width:820px){
  #drawer{min-width:0;width:92vw}
  #drawer .d-col{grid-template-columns:1fr auto;gap:2px 8px}
  #drawer .d-col .kk{justify-self:end}
  #drawer .d-col .dsc{grid-column:1/-1}
  #sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);transition:transform .25s}
  #sidebar.open{transform:translateX(0)}
  #burger{display:block;background:none;border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:5px 9px;cursor:pointer;font-size:14px}
  #svc-desc{display:none}
  #legend{display:none}
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="brand">
      <h1>CRM<span>::</span>schema</h1>
      <p>Mikroservislar DB arxitekturasi</p>
    </div>
    <nav id="menu"></nav>
    <div id="sidebar-foot">assignment_id → hrm.assignment · inventory → employee<br>Yangi servicelar: bigint ID + SEQ, 7 audit ustun,<br>soft delete (status), localized_name (5 til)</div>
  </aside>
  <div id="main">
    <div id="topbar">
      <button id="burger">☰</button>
      <div id="svc-title"></div>
      <div id="svc-desc"></div>
      <a class="xlink" href="crm-design-spa.html" target="_self" title="Dizayn prototipiga o'tish">
        UI prototip <span class="ar">↗</span></a>
      <a class="xlink" id="ui-link" href="crm-design-spa.html" style="display:none"></a>
      <div id="legend">
        <span class="lg"><i style="background:var(--pk)"></i>PK</span>
        <span class="lg"><i style="background:var(--fk)"></i>FK</span>
        <span class="lg"><i style="background:var(--uk)"></i>UK</span>
        <span class="lg"><i style="background:var(--ext)"></i>EXT</span>
        <span class="lg"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#24405f" stroke-width="2"/></svg>1:N</span>
        <span class="lg"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#a97fd4" stroke-width="2"/></svg>1:1</span>
        <span class="lg"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#c9a35a" stroke-width="2" stroke-dasharray="2 4"/></svg>N:M</span>
        <span class="lg"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#5f87b8" stroke-width="2" stroke-dasharray="6 4"/></svg>self</span>
      </div>
    </div>
    <div id="canvas-wrap"><div id="canvas"><svg id="wires"></svg></div></div>
  </div>
</div>
<div id="overlay"></div>
<aside id="drawer">
  <div id="drawer-h">
    <div><div class="t" id="d-title"></div><div class="s" id="d-sub"></div></div>
    <button id="drawer-sql" title="CREATE TABLE SQL nusxalash">⧉ SQL</button>
    <button id="drawer-close">✕</button>
  </div>
  <div id="drawer-body"></div>
</aside>

<script>
/* =========================================================
   SCHEMA DATA
   col: [name, type, flags, ref, description]
   flags: PK | FK | UK | NN  (vergul bilan)
   ref:  "table.col"  yoki tashqi: "ext:service.table.col"
========================================================= */
const DB = {

"hrm-service":{
 group:"CORE",
 desc:"MAVJUD — hrm_service_db. 18 jadval, 24 FK, 34 sequence. Har jadvalda 7 standart audit ustun va soft delete (status). QILINISHI KERAK: outbox_events + processed_events qo'shish (kafka-event-standart naqshi) — assignment.ended/created eventlari CRM handover jarayoni uchun SHART (event-katalog: hrm_service_events).",
 tables:[
 {name:"org_structure",desc:"Tashkilot tuzilmasi (ierarxik). DIQQAT: parent uchun FK constraint e'lon qilinmagan — butunlik faqat ilova darajasida.",cols:[
  ["id","bigint","PK","","SEQ_ORG_STRUCTURE_ID"],
  ["sort_order","bigint","","","Tartib"],
  ["short_code","varchar(500)","","","Qisqa kod"],
  ["localized_name","varchar(2000)","NN","","5 tilli JSON {uzLat, uzCrl, kaaLat, ru, en}"],
  ["logo_file_hash","varchar(255)","EXT","ext:file.file_storage.hash","Logo — file-service hash orqali (FKsiz)"],
  ["status","enum","NN","","RecordStatus: ACTIVE / INACTIVE / DELETED \u2014 platforma soft-delete standarti"],
  ["parent_org_structure_id","bigint","","org_structure.id","Ierarxiya — FK e'lon qilinmagan!"]]},
 {name:"branch",desc:"Filial (ierarxik) — eng ko'p ustunli jadval (25). BranchStatus: ACTIVE/DELETED (INACTIVE yo'q).",cols:[
  ["id","bigint","PK","","SEQ_BRANCH_ID"],
  ["sort_order","bigint","","","Tartib"],
  ["localized_name","varchar(2000)","NN","","5 tilli JSON"],
  ["short_code","varchar(500)","","","Qisqa kod"],
  ["address","varchar(2000)","NN","","Manzil"],
  ["postal_code","varchar(16)","","","Pochta indeksi"],
  ["street_name","varchar(255)","","","Ko'cha"],
  ["building_number","varchar(32)","","","Bino raqami"],
  ["unit_number","varchar(32)","","","Xona/blok"],
  ["latitude","decimal(21,2)","","","Kenglik"],
  ["longitude","decimal(21,2)","","","Uzunlik"],
  ["status","enum","NN","","RecordStatus: ACTIVE / INACTIVE / DELETED \u2014 platforma soft-delete standarti"],
  ["parent_branch_id","bigint","FK","branch.id","Yuqori filial"],
  ["org_structure_id","bigint","FK","org_structure.id","Qaysi tuzilmaga tegishli"],
  ["region_id","bigint","EXT","ext:global-reference.region.id","Viloyat — FKsiz, mantiqiy"],
  ["district_id","bigint","EXT","ext:global-reference.district.id","Tuman — FKsiz, mantiqiy"],
  ["branch_level_id","bigint","FK","ref_branch_level.id","Filial darajasi"],
  ["branch_type_id","bigint","FK","ref_branch_type.id","Filial turi"]]},
 {name:"department",desc:"Bo'lim (ierarxik).",cols:[
  ["id","bigint","PK","","SEQ_DEPARTMENT_ID"],
  ["sort_order","bigint","","","Tartib"],
  ["localized_name","varchar(2000)","NN","","5 tilli JSON"],
  ["short_code","varchar(500)","","","Qisqa kod"],
  ["status","enum","NN","","RecordStatus: ACTIVE / INACTIVE / DELETED \u2014 platforma soft-delete standarti"],
  ["parent_department_id","bigint","FK","department.id","Yuqori bo'lim"],
  ["branch_id","bigint","FK","branch.id","Qaysi filialda"],
  ["department_type_id","bigint","FK","ref_department_type.id","Bo'lim turi"]]},
 {name:"position",desc:"Lavozim.",cols:[
  ["id","bigint","PK","","SEQ_POSITION_ID"],
  ["sort_order","bigint","","","Tartib"],
  ["localized_name","varchar(2000)","NN","","5 tilli JSON"],

  ["ProjectStatus","enum","NN","use:projects.status","ACTIVE / PAUSED / COMPLETED / ARCHIVED — projects.status. ARCHIVED = ro'yxatdan yashiriladi, ma'lumot qoladi"],
  ["StatusCategory","enum","NN","use:project_statuses.category → issues.status_id orqali butun logika: issue_blockers (BLOCK), status_pipeline_rules (from/to), board_columns, KPI fakt (DONE), handover ochiq vazifalar","TO_DO / IN_PROGRESS / IN_REVIEW / BLOCK / DONE — project_statuses.category. PLATFORMA ENUMI: butun tizim logikasi shunga qurilgan, KENGAYTIRILMAYDI (status nomlari erkin, kategoriya qat'iy)"],
  ["BoardMode","enum","NN","use:boards.mode → board_settings (sprint_duration/wip_limit), issues.point yoki estimated_minutes tanlovi, sprints (faqat SCRUM)","SCRUM / KANBAN — boards.mode. Baholash usulini ham belgilaydi: SCRUM → point (oldindan), KANBAN → estimated_minutes (yopishda)"],
  ["SprintStatus","enum","NN","use:sprints.status","PLANNED / ACTIVE / COMPLETED — sprints.status. Bir loyihada bir vaqtda faqat bitta ACTIVE sprint (partial unique index)"],
  ["MemberStatus","enum","NN","use:project_members.status → assignment_handovers ochilishi","ACTIVE / ENDED — project_members.status. ENDED: assignment.ended yoki partnership.ended eventida yopiladi (handover ochiladi)"],
  ["HandoverStatus","enum","NN","use:assignment_handovers.status","PENDING / IN_PROGRESS / COMPLETED / CANCELLED — assignment_handovers.status. PENDING 3 kundan oshsa rahbarga eskalatsiya"],
  ["IssueAssignmentRole","enum","NN","use:issue_assignments.role","ASSIGNEE / REVIEWER — issue_assignments.role. KPI fakti FAQAT ASSIGNEE uchun yoziladi"],
  ["IssueLinkType","enum","NN","use:issue_links.link_type","RELATES_TO / DUPLICATES / CLONES — issue_links.link_type. DIQQAT: blocks/is_blocked_by BU YERDA YO'Q — bloklash issue_blockers jadvalida (sabab majburiy)"],

function syncUiLink(key){

function render(key){
  canvas.querySelectorAll('.tbl').forEach(t=>t.remove());
  wires.innerHTML='';
  canvas.classList.remove('has-focus');
  canvas.classList.toggle('docmode',!!DB[key].doc);
  const svc=DB[key];
  syncUiLink(key);
  const VGAP=80,HGAP=72,W=252,PAD=48;
  const availW=wrap.clientWidth-PAD*2;
  const nCols=Math.max(1,Math.min(8,Math.floor((availW+HGAP)/(W+HGAP)))); // ekranga sig'gancha, 8 gacha
  const colH=new Array(nCols).fill(PAD);
  const els={};

  // 1) Elementlarni yaratish va o'lchash
  const heights={};
  svc.tables.forEach(t=>{
    const el=document.createElement('div');
    el.className='tbl';el.dataset.tbl=t.name;
    let rows=t.cols.map(c=>{
      const flags=c[2]?c[2].split(','):[];
      const ks=flags.filter(f=>['PK','FK','UK','EXT'].includes(f))
        .map(f=>`<span class="k ${f.toLowerCase()}">${f}</span>`).join('');
      return `<div class="row" data-col="${c[0]}">${ks}<span class="cn">${c[0]}</span><span class="ct">${c[1]}</span></div>`;
    }).join('');
    const sk=scopeKind(key,t);
    const audFoot=t.noaudit?'':`<div class="row aud">⊞ +7 audit${sk?(sk==='full'?' · +3 scope':' · +1 tenant'):''}</div>`;
    const cntTxt=t.noaudit?t.cols.length:`${t.cols.length}+7${sk?(sk==='full'?'+3':'+1'):''}`;
    el.innerHTML=`<div class="tbl-h"><b>${t.name}</b><span class="n">${cntTxt}</span><button class="lnk" title="Bog'liq tablelarni ajratib ko'rsatish">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5" cy="6" r="2.4"/><circle cx="19" cy="6" r="2.4"/><circle cx="12" cy="18" r="2.4"/>
          <path d="M7.4 6h9.2M6.2 8.1l4.6 8M17.8 8.1l-4.6 8"/>
        </svg></button></div>${rows}${audFoot}`;
    el.style.left='0px';el.style.top='0px';
    canvas.appendChild(el);
    els[t.name]=el;heights[t.name]=el.offsetHeight;
    el.onclick=e=>{e.stopPropagation();focusTable(key,t.name)};
    el.querySelector('.lnk').onclick=e=>{
      e.stopPropagation();
      const b=e.currentTarget, wasOn=b.classList.contains('on');
      canvas.querySelectorAll('.tbl-h .lnk.on').forEach(x=>x.classList.remove('on'));
      if(wasOn){clearFocusStyles();canvas.classList.remove('has-focus');return;}
      b.classList.add('on');
      focusConnections(key,t.name);
    };
  });

  // 2) Qo'shnilar grafi (ichki FK'lar bo'yicha)
  const nb={};svc.tables.forEach(t=>nb[t.name]=new Set());
  svc.tables.forEach(t=>t.cols.forEach(c=>{
    const r=c[3];
    if(r&&!r.startsWith('ext:')&&!r.startsWith('use:')){
      const tg=r.split('.')[0];
      if(nb[tg]!==undefined&&tg!==t.name){nb[t.name].add(tg);nb[tg].add(t.name);}
    }
  }));

  // 3) BFS tartib — eng ko'p bog'langan (markaziy) tabledan boshlab,
  //    bog'langanlar ketma-ket keladi
  const visited=new Set(),order=[];
  const seeds=svc.tables.map(t=>t.name).sort((a,b)=>nb[b].size-nb[a].size);
  seeds.forEach(s=>{
    if(visited.has(s))return;
    const q=[s];visited.add(s);
    while(q.length){
      const n=q.shift();order.push(n);
      [...nb[n]].sort((a,b)=>nb[b].size-nb[a].size)
        .forEach(m=>{if(!visited.has(m)){visited.add(m);q.push(m);}});
    }
  });

  // 4) Joylashtirish — har bir table allaqachon joylashgan qo'shnilariga
  //    eng yaqin ustunga qo'yiladi (masofa + ustun balandligi jarima)
  const pos={};
  order.forEach(nm=>{
    let best=0,bestCost=Infinity;
    for(let ci=0;ci<nCols;ci++){
      const y=colH[ci];
      let cost=y*0.5; // balans jarima: ustunlar teng to'lsin
      nb[nm].forEach(m=>{
        if(pos[m])cost+=Math.abs(ci-pos[m].ci)*(W+HGAP)+Math.abs(y-pos[m].y);
      });
      if(cost<bestCost){bestCost=cost;best=ci;}
    }
    pos[nm]={ci:best,y:colH[best]};
    const el=els[nm];
    el.style.left=(PAD+best*(W+HGAP))+'px';
    el.style.top=colH[best]+'px';
    colH[best]+=heights[nm]+VGAP;
  });

  const totalH=Math.max(...colH)+PAD,totalW=PAD*2+nCols*(W+HGAP)-HGAP;
  canvas.style.height=totalH+'px';canvas.style.width=Math.max(totalW,wrap.clientWidth)+'px';
  wires.setAttribute('width',Math.max(totalW,wrap.clientWidth));
  wires.setAttribute('height',totalH);

  // internal FK wires
  svc.tables.forEach(t=>{
    t.cols.forEach(c=>{
      const ref=c[3];
      if(!ref||ref.startsWith('ext:')||ref.startsWith('use:'))return;
      const target=ref.split('.')[0];
      if(!els[target])return;
      drawWire(els[t.name],els[target],c,t.name,target);
    });
  });
}

/* Bog'lanish turini aniqlash:
   self  — o'z-o'ziga (ierarxiya: parent_id)
   1:1   — FK ustunida UK ham bor
   N:M   — FK ustuni composite PK tarkibida (junction table)
   1:N   — oddiy FK (standart holat)                       */
function wireType(colFlags,src,dst){
  const f=colFlags?colFlags.split(','):[];
  if(src===dst)return['wself','self (ierarxiya)'];
  if(f.includes('UK'))return['w11','1:1'];
  if(f.includes('PK'))return['wident','N:M (junction)'];
  return['','1:N'];
}

function drawWire(srcEl,dstEl,col,srcName,dstName){
  const colName=col[0];
  const [cls,typeLabel]=wireType(col[2],srcName,dstName);
  const row=[...srcEl.querySelectorAll('.row')].find(r=>r.dataset.col===colName);
  const sy=srcEl.offsetTop+(row?row.offsetTop+row.offsetHeight/2:20);
  const dy=dstEl.offsetTop+16;
  const sL=srcEl.offsetLeft,sR=sL+srcEl.offsetWidth;
  const dL=dstEl.offsetLeft,dR=dL+dstEl.offsetWidth;
  let x1,x2,d;
  if(srcName===dstName){
    // self-loop: o'ng tomondan aylanma
    const out=sR+44;
    d=`M ${sR} ${sy} C ${out} ${sy}, ${out} ${dy}, ${sR} ${dy}`;
  }else if(dL>=sR){
    x1=sR;x2=dL;const mid=(x1+x2)/2;
    d=`M ${x1} ${sy} C ${mid} ${sy}, ${mid} ${dy}, ${x2} ${dy}`;
  }else if(dR<=sL){
    x1=sL;x2=dR;const mid=(x1+x2)/2;
    d=`M ${x1} ${sy} C ${mid} ${sy}, ${mid} ${dy}, ${x2} ${dy}`;
  }else{
    // bir ustunda ustma-ust — o'ng tomondan aylantirib
    const out=Math.max(sR,dR)+34;
    d=`M ${sR} ${sy} C ${out} ${sy}, ${out} ${dy}, ${dR} ${dy}`;
  }
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','wireg');
  const hit=document.createElementNS('http://www.w3.org/2000/svg','path');
  hit.setAttribute('d',d);hit.setAttribute('class','wire-hit');
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d);
  p.setAttribute('class','wire '+cls);
  p.dataset.src=srcName;p.dataset.dst=dstName;
  const tip=document.createElementNS('http://www.w3.org/2000/svg','title');
  tip.textContent=`${srcName}.${colName} → ${dstName}  [${typeLabel}]`;
  g.appendChild(tip);g.appendChild(hit);g.appendChild(p);
  g.onclick=e=>{e.stopPropagation();focusWire(srcName,dstName,p)};
  wires.appendChild(g);
}

/* Tugma: table + barcha bog'langan tablelar va chiziqlarga fokus (drawer ochilmaydi) */
function focusConnections(svcKey,tblName){
  const svc=DB[svcKey];
  clearFocusStyles();
  closeDrawerPanel();
  canvas.classList.add('has-focus');
  const rel=new Set();
  svc.tables.forEach(t=>t.cols.forEach(c=>{
    const r=c[3];
    if(r&&!r.startsWith('ext:')&&!r.startsWith('use:')){
      const tg=r.split('.')[0];
      if(t.name===tblName&&tg!==tblName)rel.add(tg);
      if(tg===tblName&&t.name!==tblName)rel.add(t.name);
    }
  }));
  canvas.querySelectorAll('.tbl').forEach(el=>{
    if(el.dataset.tbl===tblName)el.classList.add('focused');
    else if(rel.has(el.dataset.tbl))el.classList.add('wired');
  });
  wires.querySelectorAll('.wire').forEach(w=>{
    if(w.dataset.src===tblName||w.dataset.dst===tblName)w.classList.add('hot');
  });
}

/* Chiziqqa bosilganda: ikkala table yoritiladi, shu yo'nalishdagi chiziqlar hot bo'ladi */
function focusWire(srcName,dstName,path){
  clearFocusStyles();
  canvas.classList.add('has-focus');
  canvas.querySelectorAll('.tbl').forEach(el=>{
    if(el.dataset.tbl===srcName||el.dataset.tbl===dstName)el.classList.add('wired');
  });
  wires.querySelectorAll('.wire').forEach(w=>{
    if((w.dataset.src===srcName&&w.dataset.dst===dstName)||
       (w.dataset.src===dstName&&w.dataset.dst===srcName))w.classList.add('hot');
  });
}

function clearFocusStyles(){
  canvas.classList.remove('has-focus');
  canvas.querySelectorAll('.tbl-h .lnk.on').forEach(b=>b.classList.remove('on'));
  canvas.querySelectorAll('.tbl').forEach(el=>el.classList.remove('focused','related','wired'));
  wires.querySelectorAll('.wire').forEach(w=>w.classList.remove('hot'));
}

/* ---------- SQL generatsiya ---------- */
let curSvcKey=null,curTbl=null;
function sqlType(t){
  const m={'int':'INTEGER','timestamptz':'TIMESTAMPTZ'};
  return (m[t]||t).toUpperCase();
}
function genSQL(svcKey,tbl){
  const T=tbl.name;
  const pkCols=tbl.cols.filter(c=>(c[2]||'').includes('PK')).map(c=>c[0]);
  const ukCols=tbl.cols.filter(c=>(c[2]||'').includes('UK')).map(c=>c[0]);
  let L=[],FKs=[],cmts=[];
  L.push('-- ============================================');
  L.push(`-- ${svcKey} · ${T}`);
  L.push(`-- ${tbl.desc.replace(/\n/g,' ')}`);
  L.push('-- ============================================');
  L.push(`CREATE SEQUENCE IF NOT EXISTS seq_${T}_id START WITH 1 INCREMENT BY 1;`);
  if(!tbl.noaudit)L.push(`CREATE SEQUENCE IF NOT EXISTS seq_${T}_last_updated_id START WITH 1 INCREMENT BY 1;`);
  L.push('');
  L.push(`CREATE TABLE IF NOT EXISTS ${T} (`);
  const body=[];
  tbl.cols.forEach(c=>{
    const [nm,tp,fl,ref]=c;const flags=fl?fl.split(','):[];
    let line=`    ${nm} ${sqlType(tp)}`;
    if(nm==='id'&&flags.includes('PK')&&pkCols.length===1){
      line=`    id BIGINT PRIMARY KEY DEFAULT nextval('seq_${T}_id')`;
    }else{
      if(flags.includes('NN'))line+=' NOT NULL';
      if(flags.includes('UK')&&ukCols.length===1)line+=' UNIQUE';
    }
    if(ref&&ref.startsWith('use:'))line+=`  -- ishlatilishi: ${ref.slice(4)}`;
    else if(ref&&ref.startsWith('ext:'))line+=`  -- mantiqiy ref (FKsiz): ${ref.slice(4)}`;
    body.push(line);
    if(ref&&!ref.startsWith('ext:')&&!ref.startsWith('use:')){
      const [rt,rc]=ref.split('.');
      FKs.push(`    CONSTRAINT fk_${T}__${nm} FOREIGN KEY (${nm}) REFERENCES ${rt} (${rc})`);
    }
  });
  const sk2=scopeKind(svcKey,tbl);
  if(sk2){
    body.push('    -- tenant/scope ustunlari (multi-tenant-standart)');
    body.push('    org_structure_id BIGINT NOT NULL  -- TENANT, mantiqiy ref: hrm.org_structure.id (RLS)');
    if(sk2==='full'){
      body.push('    branch_id BIGINT NOT NULL  -- mantiqiy ref: hrm.branch.id');
      body.push('    department_id BIGINT  -- mantiqiy ref: hrm.department.id');
    }
  }
  if(!tbl.noaudit){
    body.push('    -- standart audit ustunlari (butun loyihada bir xil)');
    body.push('    created_date TIMESTAMP NOT NULL');
    body.push('    last_modified_date TIMESTAMP NOT NULL');
    body.push('    created_assignment_id BIGINT NOT NULL  -- mantiqiy ref: hrm.assignment.id');
    body.push('    created_employee_id BIGINT NOT NULL  -- mantiqiy ref: hrm.employee.id');
    body.push('    last_modified_assignment_id BIGINT NOT NULL');
    body.push('    last_modified_employee_id BIGINT NOT NULL');
    body.push(`    last_updated_id BIGINT NOT NULL UNIQUE DEFAULT nextval('seq_${T}_last_updated_id')`);
  }
  if(pkCols.length>1)FKs.push(`    PRIMARY KEY (${pkCols.join(', ')})`);
  if(ukCols.length>1)FKs.push(`    -- TEKSHIRING: UK kompozit bo'lishi mumkin — tavsifga qarang: (${ukCols.join(', ')})`);
  L.push([...body,...FKs].map((x,i,a)=>{
    if(x.trimStart().startsWith('--'))return x;
    const rest=a.slice(i+1).some(y=>!y.trimStart().startsWith('--'));
    if(!rest)return x;
    return x.includes('  -- ')?x.replace('  -- ',',  -- '):x+',';
  }).join('\n'));
  L.push(');');
  L.push('');
  L.push(`COMMENT ON TABLE ${T} IS '${tbl.desc.replace(/'/g,"''")}';`);
  return L.join('\n');
}

/* ---------- Focus & drawer ---------- */
function focusTable(svcKey,tblName){
  focused=tblName;
  const svc=DB[svcKey];
  const tbl=svc.tables.find(t=>t.name===tblName);
  clearFocusStyles();
  canvas.classList.add('has-focus');
  // related set
  const rel=new Set();
  tbl.cols.forEach(c=>{if(c[3]&&!c[3].startsWith('ext:'))rel.add(c[3].split('.')[0])});
  svc.tables.forEach(t=>t.cols.forEach(c=>{
    if(c[3]&&!c[3].startsWith('ext:')&&c[3].split('.')[0]===tblName)rel.add(t.name);
  }));
  canvas.querySelectorAll('.tbl').forEach(el=>{
    el.classList.toggle('focused',el.dataset.tbl===tblName);
    el.classList.toggle('related',el.dataset.tbl!==tblName&&rel.has(el.dataset.tbl));
  });
  wires.querySelectorAll('.wire').forEach(w=>{
    w.classList.toggle('hot',w.dataset.src===tblName||w.dataset.dst===tblName);
  });
  openDrawer(svcKey,tbl);
}

function openDrawer(svcKey,tbl){
  curSvcKey=svcKey;curTbl=tbl;
  const isEvt=svcKey==='event-katalog'||tbl.name==='event_envelope';
  $('#drawer-sql').style.display=isEvt?'none':'';
  $('#d-title').textContent=tbl.name;
  $('#d-sub').textContent=svcKey+' · '+tbl.cols.length+' ustun';
  const body=$('#drawer-body');
  let html=`<div class="d-desc">${tbl.desc}</div>`;
  html+=`<div class="d-sec">Ustunlar</div>`;
  tbl.cols.forEach(c=>{
    const flags=c[2]?c[2].split(','):[];
    const ks=flags.map(f=>{
      const cls=['PK','FK','UK','EXT'].includes(f)?f.toLowerCase():'';
      return cls?`<span class="k ${cls}">${f}</span>`:`<span class="k" style="background:rgba(124,150,182,.15);color:var(--muted)">${f}</span>`;
    }).join('');
    let refHtml='';
    if(c[3]){
      const isExt=c[3].startsWith('ext:');
      const isUse=c[3].startsWith('use:');
      if(isUse)refHtml=`<span class="ref use">◆ ishlatilishi: ${c[3].slice(4)}</span>`;
      else refHtml=`<span class="ref ${isExt?'ext':''}">→ ${isExt?c[3].slice(4)+' (tashqi)':c[3]}</span>`;
    }
    html+=`<div class="d-col">
      <span class="nm">${c[0]}</span><span class="tp">${c[1]}</span><span class="kk">${ks}</span>
      <span class="dsc">${c[4]||''}${refHtml}</span>
    </div>`;
  });
  // tenant/scope ustunlari (multi-tenant-standart)
  const sk=scopeKind(svcKey,tbl);
  if(sk){
    html+=`<div class="d-sec">Tenant / scope ustunlari — multi-tenant-standart</div>`;
    SCOPE_COLS[sk].forEach(c=>{
      const flags=c[2]?c[2].split(','):[];
      const ks=flags.map(f=>{
        const cls=['PK','FK','UK','EXT'].includes(f)?f.toLowerCase():'';
        return cls?`<span class="k ${cls}">${f}</span>`:`<span class="k" style="background:rgba(124,150,182,.15);color:var(--muted)">${f}</span>`;
      }).join('');
      const refHtml=c[3]?`<span class="ref ext">→ ${c[3].slice(4)} (tashqi)</span>`:'';
      html+=`<div class="d-col aud-col">
        <span class="nm">${c[0]}</span><span class="tp">${c[1]}</span><span class="kk">${ks}</span>
        <span class="dsc">${c[4]||''}${refHtml}</span>
      </div>`;
    });
  }
  // audit ustunlari (standart pattern)
  if(!tbl.noaudit){
    html+=`<div class="d-sec">Audit ustunlari — butun loyihada bir xil</div>`;
    AUDIT_COLS.forEach(c=>{
      const flags=c[2]?c[2].split(','):[];
      const ks=flags.map(f=>{
        const cls=['PK','FK','UK','EXT'].includes(f)?f.toLowerCase():'';
        return cls?`<span class="k ${cls}">${f}</span>`:`<span class="k" style="background:rgba(124,150,182,.15);color:var(--muted)">${f}</span>`;
      }).join('');
      const refHtml=c[3]?`<span class="ref ext">→ ${c[3].slice(4)} (tashqi)</span>`:'';
      html+=`<div class="d-col aud-col">
        <span class="nm">${c[0]}</span><span class="tp">${c[1]}</span><span class="kk">${ks}</span>
        <span class="dsc">${c[4]||''}${refHtml}</span>
      </div>`;
    });
  }
  // referenced by
  const svc=DB[svcKey];
  const refs=[];
  svc.tables.forEach(t=>t.cols.forEach(c=>{
    if(c[3]&&!c[3].startsWith('ext:')&&c[3].split('.')[0]===tbl.name)
      refs.push(`<b>${t.name}</b>.${c[0]} → ${c[3]}`);
  }));
  if(refs.length){
    html+=`<div class="d-sec">Bu tablega bog'lanadi</div>`;
    refs.forEach(r=>html+=`<div class="d-rel">${r}</div>`);
  }
  body.innerHTML=html;
  drawer.classList.add('open');
  overlay.classList.add('show');
}

function closeDrawerPanel(){
  drawer.classList.remove('open');
  overlay.classList.remove('show');
}
function closeDrawer(){
  closeDrawerPanel();
  clearFocusStyles();
  focused=null;
}

$('#drawer-sql').onclick=async()=>{
  if(!curTbl)return;
  const sql=genSQL(curSvcKey,curTbl);
  try{await navigator.clipboard.writeText(sql);}
  catch(e){
    const ta=document.createElement('textarea');ta.value=sql;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');ta.remove();
  }
  const b=$('#drawer-sql');b.classList.add('copied');b.textContent='✓ Nusxalandi';
  setTimeout(()=>{b.classList.remove('copied');b.textContent='⧉ SQL'},1600);
};
$('#drawer-close').onclick=closeDrawer;
overlay.onclick=closeDrawer;
canvas.onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
$('#burger').onclick=()=>$('#sidebar').classList.toggle('open');
addEventListener('resize',()=>{if(currentSvc)render(currentSvc)});

selectService('hrm-service');
</script>
