<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Database Arxitekturasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1626;
  --bg-grid:#16243c;
  --panel:#101f36;
  --panel-2:#0e1b30;
  --line:#24405f;
  --line-soft:#1a3050;
  --ink:#d9e6f5;
  --muted:#7c96b6;
  --faint:#54708f;
  --pk:#ffc861;
  --fk:#6fe0c0;
  --uk:#d9a0f0;
  --typ:#7fb0e8;
  --ext:#f08c7a;
  --accent:#4fa3f7;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  overflow:hidden;
  font-size:14px;
}
/* ===== Layout ===== */
#app{display:flex;height:100vh}
/* ===== Sidebar ===== */
#sidebar{
  width:248px;min-width:248px;
  background:var(--panel-2);
  border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;
  z-index:30;
}
#brand{
  padding:18px 18px 14px;
  border-bottom:1px solid var(--line-soft);
}
#brand h1{
  font-family:var(--mono);
  font-size:15px;font-weight:700;letter-spacing:.04em;
  color:var(--ink);
}
#brand h1 span{color:var(--accent)}
#brand p{font-size:11px;color:var(--faint);margin-top:3px;letter-spacing:.02em}
#menu{flex:1;overflow-y:auto;padding:10px 8px}
.menu-group{
  font-size:10px;text-transform:uppercase;letter-spacing:.14em;
  color:var(--faint);padding:12px 10px 6px;
}
.menu-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:6px;cursor:pointer;
  color:var(--muted);font-family:var(--mono);font-size:12.5px;
  border:1px solid transparent;
  transition:background .15s,color .15s;
  user-select:none;
}
.menu-item:hover{background:var(--bg-grid);color:var(--ink)}
.menu-item.active{
  background:var(--bg-grid);color:var(--ink);
  border-color:var(--line);
}
.menu-item .dot{
  width:7px;height:7px;border-radius:2px;background:var(--faint);flex:none;
}
.menu-item.active .dot{background:var(--accent)}
.menu-item .cnt{
  margin-left:auto;font-size:10px;color:var(--faint);
  background:var(--panel);padding:1px 6px;border-radius:8px;
}
#sidebar-foot{
  padding:10px 14px;border-top:1px solid var(--line-soft);
  font-size:10px;color:var(--faint);line-height:1.6;font-family:var(--mono);
}
/* ===== Main ===== */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{
  height:56px;flex:none;
  display:flex;align-items:center;gap:14px;
  padding:0 22px;
  border-bottom:1px solid var(--line-soft);
  background:var(--panel-2);
}
#svc-title{font-family:var(--mono);font-size:15px;font-weight:600}
#svc-desc{font-size:12px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#legend{display:flex;gap:12px;flex:none}
.lg{display:flex;align-items:center;gap:5px;font-size:10px;font-family:var(--mono);color:var(--muted)}
.lg i{width:8px;height:8px;border-radius:2px;display:inline-block}
/* ===== Canvas ===== */
#canvas-wrap{flex:1;overflow:auto;position:relative;
  background-image:radial-gradient(circle,var(--bg-grid) 1px,transparent 1px);
  background-size:26px 26px;
}
#canvas{position:relative;min-width:100%;min-height:100%}
#wires{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.wireg{pointer-events:visibleStroke;cursor:pointer}
.wire-hit{fill:none;stroke:transparent;stroke-width:14}
.wire{fill:none;stroke:var(--line);stroke-width:1.5;transition:stroke .15s,opacity .15s,stroke-width .15s}
.wire.w11{stroke:#a97fd4}
.wire.wident{stroke:#c9a35a;stroke-dasharray:2 4}
.wire.wself{stroke:#5f87b8;stroke-dasharray:6 4}
.wireg:hover .wire{stroke:var(--fk);stroke-width:2.5;opacity:1}
.wire.hot{stroke:var(--fk);stroke-width:2.5}
.has-focus .wire{opacity:.1}
.has-focus .wire.hot{opacity:1}
.has-focus .wireg:hover .wire{opacity:1}
.has-focus .tbl.wired{opacity:1;border-color:var(--fk);
  box-shadow:0 0 0 2px rgba(111,224,192,.25),0 10px 32px rgba(0,0,0,.5)}
/* ===== Table card ===== */
.tbl{
  position:absolute;width:252px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  font-family:var(--mono);
  cursor:pointer;
  transition:opacity .25s,border-color .2s,box-shadow .2s;
  box-shadow:0 4px 18px rgba(0,0,0,.35);
}
.tbl:hover{border-color:var(--accent)}
.has-focus .tbl{opacity:.18}
.has-focus .tbl.related{opacity:.55}
.has-focus .tbl.focused{
  opacity:1;border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(79,163,247,.35),0 10px 32px rgba(0,0,0,.5);
}
.tbl-h{
  padding:8px 12px;
  border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,rgba(79,163,247,.10),transparent);
  border-radius:8px 8px 0 0;
}
.tbl-h b{font-size:12.5px;font-weight:600;letter-spacing:.02em}
.tbl-h .n{margin-left:auto;font-size:9.5px;color:var(--faint)}
.row{
  display:flex;align-items:center;gap:6px;
  padding:3.5px 12px;font-size:11px;line-height:1.35;
  border-bottom:1px solid rgba(26,48,80,.4);
}
.row:last-child{border-bottom:none;border-radius:0 0 8px 8px}
.row .cn{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ct{color:var(--typ);margin-left:auto;font-size:10px;flex:none}
.k{font-size:8.5px;font-weight:700;padding:1px 4px;border-radius:3px;flex:none;letter-spacing:.04em}
.k.pk{background:rgba(255,200,97,.16);color:var(--pk)}
.k.fk{background:rgba(111,224,192,.14);color:var(--fk)}
.k.uk{background:rgba(217,160,240,.14);color:var(--uk)}
.k.ext{background:rgba(240,140,122,.14);color:var(--ext)}
/* ===== Drawer ===== */
#drawer{
  position:fixed;top:0;right:0;height:100vh;width:430px;max-width:92vw;
  background:var(--panel-2);
  border-left:1px solid var(--line);
  transform:translateX(105%);
  transition:transform .28s cubic-bezier(.22,.8,.3,1);
  z-index:50;display:flex;flex-direction:column;
  box-shadow:-18px 0 50px rgba(0,0,0,.5);
}
#drawer.open{transform:translateX(0)}
#drawer-h{
  padding:18px 20px 14px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:flex-start;gap:12px;
}
#drawer-h .t{font-family:var(--mono);font-size:16px;font-weight:700}
#drawer-h .s{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:2px}
#drawer-close{
  margin-left:auto;background:none;border:1px solid var(--line);
  color:var(--muted);width:28px;height:28px;border-radius:6px;cursor:pointer;
  font-size:14px;line-height:1;flex:none;
}
#drawer-close:hover{color:var(--ink);border-color:var(--accent)}
#drawer-body{flex:1;overflow-y:auto;padding:16px 20px 40px}
.d-desc{
  font-size:12.5px;color:var(--muted);line-height:1.6;
  padding:10px 12px;background:var(--panel);border:1px solid var(--line-soft);
  border-radius:6px;margin-bottom:18px;
}
.d-sec{
  font-size:10px;text-transform:uppercase;letter-spacing:.14em;
  color:var(--faint);margin:18px 0 8px;
}
.d-col{
  border:1px solid var(--line-soft);border-radius:6px;
  padding:9px 12px;margin-bottom:7px;background:var(--panel);
}
.d-col-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.d-col-top .nm{font-family:var(--mono);font-size:12.5px;font-weight:600}
.d-col-top .tp{font-family:var(--mono);font-size:11px;color:var(--typ)}
.d-col .ref{
  font-family:var(--mono);font-size:10.5px;color:var(--fk);
  margin-top:4px;
}
.d-col .ref.ext{color:var(--ext)}
.d-col .dsc{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.55}
.d-rel{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  padding:6px 10px;border:1px dashed var(--line);border-radius:6px;margin-bottom:6px;
}
.d-rel b{color:var(--fk);font-weight:600}
#overlay{
  position:fixed;inset:0;background:rgba(5,10,20,.35);
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;
}
#overlay.show{opacity:1;pointer-events:auto}
/* mobile */
#burger{display:none}
@media(max-width:820px){
  #sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);transition:transform .25s}
  #sidebar.open{transform:translateX(0)}
  #burger{display:block;background:none;border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:5px 9px;cursor:pointer;font-size:14px}
  #svc-desc{display:none}
  #legend{display:none}
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="brand">
      <h1>CRM<span>::</span>schema</h1>
      <p>Mikroservislar DB arxitekturasi</p>

    <div id="sidebar-foot">assignment_id → hrm.assignments<br>inventory → hrm.employees</div>

  <div id="main">

      <button id="burger">☰</button>

      <div id="legend">
        <span class="lg"><i style="background:var(--pk)"></i>PK</span>
        <span class="lg"><i style="background:var(--fk)"></i>FK</span>

        <span class="lg"><i style="background:var(--ext)"></i>EXT</span>
        <span class="lg"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#24405f" stroke-width="2"/></svg>1:N</span>
        <span class="lg"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#a97fd4" stroke-width="2"/></svg>1:1</span>
        <span class="lg"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#c9a35a" stroke-width="2" stroke-dasharray="2 4"/></svg>N:M</span>
        <span class="lg"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#5f87b8" stroke-width="2" stroke-dasharray="6 4"/></svg>self</span>
      </div>
    </div>
    <div id="canvas-wrap"><div id="canvas"><svg id="wires"></svg></div></div>
  </div>
</div>
<div id="overlay"></div>
<aside id="drawer">
  <div id="drawer-h">
    <div><div class="t" id="d-title"></div><div class="s" id="d-sub"></div></div>
    <button id="drawer-close">✕</button>
  </div>
  <div id="drawer-body"></div>
</aside>

/* ========================================================= */
const $=s=>document.querySelector(s);
const canvas=$('#canvas'),wrap=$('#canvas-wrap'),wires=$('#wires'),
      drawer=$('#drawer'),overlay=$('#overlay'),menu=$('#menu');
let currentSvc=null,focused=null;

/* ---------- Menu ---------- */
(function buildMenu(){
  const groups={};
  Object.entries(DB).forEach(([k,v])=>{(groups[v.group]??=[]).push(k)});
  Object.entries(groups).forEach(([g,items])=>{
    const h=document.createElement('div');h.className='menu-group';h.textContent=g;menu.appendChild(h);
    items.forEach(k=>{
      const el=document.createElement('div');
      el.className='menu-item';el.dataset.svc=k;
      el.innerHTML=`<span class="dot"></span>${k}<span class="cnt">${DB[k].tables.length}</span>`;
      el.onclick=()=>{selectService(k);if(innerWidth<=820)$('#sidebar').classList.remove('open')};
      menu.appendChild(el);
    });
  });
})();

/* ---------- Render service ---------- */
function selectService(key){
  currentSvc=key;focused=null;
  document.querySelectorAll('.menu-item').forEach(m=>m.classList.toggle('active',m.dataset.svc===key));
  $('#svc-title').textContent=key;
  $('#svc-desc').textContent=DB[key].desc;
  closeDrawer();
  render(key);
  wrap.scrollTo(0,0);
}

function render(key){
  canvas.querySelectorAll('.tbl').forEach(t=>t.remove());
  wires.innerHTML='';
  canvas.classList.remove('has-focus');
  const svc=DB[key];
  const VGAP=80,HGAP=72,W=252,PAD=48;
  const availW=wrap.clientWidth-PAD*2;
  const nCols=Math.max(1,Math.min(4,Math.floor((availW+HGAP)/(W+HGAP))));
  const colH=new Array(nCols).fill(PAD);
  const els={};

  svc.tables.forEach(t=>{
    const el=document.createElement('div');
    el.className='tbl';el.dataset.tbl=t.name;
    let rows=t.cols.map(c=>{
      const flags=c[2]?c[2].split(','):[];
      const ks=flags.filter(f=>['PK','FK','UK','EXT'].includes(f))
        .map(f=>`<span class="k ${f.toLowerCase()}">${f}</span>`).join('');
      return `<div class="row" data-col="${c[0]}">${ks}<span class="cn">${c[0]}</span><span class="ct">${c[1]}</span></div>`;
    }).join('');
    el.innerHTML=`<div class="tbl-h"><b>${t.name}</b><span class="n">${t.cols.length}</span></div>${rows}`;
    // shortest column placement
    let ci=0;for(let i=1;i<nCols;i++)if(colH[i]<colH[ci])ci=i;
    el.style.left=(PAD+ci*(W+HGAP))+'px';
    el.style.top=colH[ci]+'px';
    canvas.appendChild(el);
    colH[ci]+=el.offsetHeight+VGAP;
    els[t.name]=el;
    el.onclick=e=>{e.stopPropagation();focusTable(key,t.name)};
  });

  const totalH=Math.max(...colH)+PAD,totalW=PAD*2+nCols*(W+HGAP)-HGAP;
  canvas.style.height=totalH+'px';canvas.style.width=Math.max(totalW,wrap.clientWidth)+'px';
  wires.setAttribute('width',Math.max(totalW,wrap.clientWidth));
  wires.setAttribute('height',totalH);

  // internal FK wires
  svc.tables.forEach(t=>{
    t.cols.forEach(c=>{
      const ref=c[3];
      if(!ref||ref.startsWith('ext:'))return;
      const target=ref.split('.')[0];
      if(!els[target])return;
      drawWire(els[t.name],els[target],c,t.name,target);
    });
  });
}

/* Bog'lanish turini aniqlash:
   self  — o'z-o'ziga (ierarxiya: parent_id)
   1:1   — FK ustunida UK ham bor
   N:M   — FK ustuni composite PK tarkibida (junction table)
   1:N   — oddiy FK (standart holat)                       */
function wireType(colFlags,src,dst){
  const f=colFlags?colFlags.split(','):[];
  if(src===dst)return['wself','self (ierarxiya)'];
  if(f.includes('UK'))return['w11','1:1'];
  if(f.includes('PK'))return['wident','N:M (junction)'];
  return['','1:N'];
}

function drawWire(srcEl,dstEl,col,srcName,dstName){
  const colName=col[0];
  const [cls,typeLabel]=wireType(col[2],srcName,dstName);
  const row=[...srcEl.querySelectorAll('.row')].find(r=>r.dataset.col===colName);
  const sy=srcEl.offsetTop+(row?row.offsetTop+row.offsetHeight/2:20);
  const dy=dstEl.offsetTop+16;
  const sL=srcEl.offsetLeft,sR=sL+srcEl.offsetWidth;
  const dL=dstEl.offsetLeft,dR=dL+dstEl.offsetWidth;
  let x1,x2,d;
  if(srcName===dstName){
    // self-loop: o'ng tomondan aylanma
    const out=sR+44;
    d=`M ${sR} ${sy} C ${out} ${sy}, ${out} ${dy}, ${sR} ${dy}`;
  }else if(dL>=sR){
    x1=sR;x2=dL;const mid=(x1+x2)/2;
    d=`M ${x1} ${sy} C ${mid} ${sy}, ${mid} ${dy}, ${x2} ${dy}`;
  }else if(dR<=sL){
    x1=sL;x2=dR;const mid=(x1+x2)/2;
    d=`M ${x1} ${sy} C ${mid} ${sy}, ${mid} ${dy}, ${x2} ${dy}`;
  }else{
    // bir ustunda ustma-ust — o'ng tomondan aylantirib
    const out=Math.max(sR,dR)+34;
    d=`M ${sR} ${sy} C ${out} ${sy}, ${out} ${dy}, ${dR} ${dy}`;
  }
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','wireg');
  const hit=document.createElementNS('http://www.w3.org/2000/svg','path');
  hit.setAttribute('d',d);hit.setAttribute('class','wire-hit');
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d);
  p.setAttribute('class','wire '+cls);
  p.dataset.src=srcName;p.dataset.dst=dstName;
  const tip=document.createElementNS('http://www.w3.org/2000/svg','title');
  tip.textContent=`${srcName}.${colName} → ${dstName}  [${typeLabel}]`;
  g.appendChild(tip);g.appendChild(hit);g.appendChild(p);
  g.onclick=e=>{e.stopPropagation();focusWire(srcName,dstName,p)};
  wires.appendChild(g);
}

/* Chiziqqa bosilganda: ikkala table yoritiladi, shu yo'nalishdagi chiziqlar hot bo'ladi */
function focusWire(srcName,dstName,path){
  clearFocusStyles();
  canvas.classList.add('has-focus');
  canvas.querySelectorAll('.tbl').forEach(el=>{
    if(el.dataset.tbl===srcName||el.dataset.tbl===dstName)el.classList.add('wired');
  });
  wires.querySelectorAll('.wire').forEach(w=>{
    if((w.dataset.src===srcName&&w.dataset.dst===dstName)||
       (w.dataset.src===dstName&&w.dataset.dst===srcName))w.classList.add('hot');
  });
}

function clearFocusStyles(){
  canvas.classList.remove('has-focus');
  canvas.querySelectorAll('.tbl').forEach(el=>el.classList.remove('focused','related','wired'));
  wires.querySelectorAll('.wire').forEach(w=>w.classList.remove('hot'));
}

/* ---------- Focus & drawer ---------- */
function focusTable(svcKey,tblName){
  focused=tblName;
  const svc=DB[svcKey];
  const tbl=svc.tables.find(t=>t.name===tblName);
  clearFocusStyles();
  canvas.classList.add('has-focus');
  // related set
  const rel=new Set();
  tbl.cols.forEach(c=>{if(c[3]&&!c[3].startsWith('ext:'))rel.add(c[3].split('.')[0])});
  svc.tables.forEach(t=>t.cols.forEach(c=>{
    if(c[3]&&!c[3].startsWith('ext:')&&c[3].split('.')[0]===tblName)rel.add(t.name);
  }));
  canvas.querySelectorAll('.tbl').forEach(el=>{
    el.classList.toggle('focused',el.dataset.tbl===tblName);
    el.classList.toggle('related',el.dataset.tbl!==tblName&&rel.has(el.dataset.tbl));
  });
  wires.querySelectorAll('.wire').forEach(w=>{
    w.classList.toggle('hot',w.dataset.src===tblName||w.dataset.dst===tblName);
  });
  openDrawer(svcKey,tbl);
}

function openDrawer(svcKey,tbl){
  $('#d-title').textContent=tbl.name;
  $('#d-sub').textContent=svcKey+' · '+tbl.cols.length+' ustun';
  const body=$('#drawer-body');
  let html=`<div class="d-desc">${tbl.desc}</div>`;
  html+=`<div class="d-sec">Ustunlar</div>`;
  tbl.cols.forEach(c=>{
    const flags=c[2]?c[2].split(','):[];
    const ks=flags.map(f=>{
      const cls=['PK','FK','UK','EXT'].includes(f)?f.toLowerCase():'';
      return cls?`<span class="k ${cls}">${f}</span>`:`<span class="k" style="background:rgba(124,150,182,.15);color:var(--muted)">${f}</span>`;
    }).join('');
    let refHtml='';
    if(c[3]){
      const isExt=c[3].startsWith('ext:');
      refHtml=`<div class="ref ${isExt?'ext':''}">→ ${isExt?c[3].slice(4)+'  (tashqi service)':c[3]}</div>`;
    }
    html+=`<div class="d-col">
      <div class="d-col-top"><span class="nm">${c[0]}</span><span class="tp">${c[1]}</span>${ks}</div>
      ${refHtml}
      ${c[4]?`<div class="dsc">${c[4]}</div>`:''}
    </div>`;
  });
  // referenced by
  const svc=DB[svcKey];
  const refs=[];
  svc.tables.forEach(t=>t.cols.forEach(c=>{
    if(c[3]&&!c[3].startsWith('ext:')&&c[3].split('.')[0]===tbl.name)
      refs.push(`<b>${t.name}</b>.${c[0]} → ${c[3]}`);
  }));
  if(refs.length){
    html+=`<div class="d-sec">Bu tablega bog'lanadi</div>`;
    refs.forEach(r=>html+=`<div class="d-rel">${r}</div>`);
  }
  body.innerHTML=html;
  drawer.classList.add('open');
  overlay.classList.add('show');
}

function closeDrawer(){
  drawer.classList.remove('open');
  overlay.classList.remove('show');
  clearFocusStyles();
  focused=null;
}

$('#drawer-close').onclick=closeDrawer;
overlay.onclick=closeDrawer;
canvas.onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
$('#burger').onclick=()=>$('#sidebar').classList.toggle('open');
addEventListener('resize',()=>{if(currentSvc)render(currentSvc)});

selectService('hrm-service');
</script>
